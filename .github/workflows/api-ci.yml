name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run API tests
        run: python -m pytest
      - name: Run Ruff checks
        run: ruff check apps/api
