name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: omni_engine
          POSTGRES_USER: omni_admin
          POSTGRES_PASSWORD: admin-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni_admin -d omni_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNI_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://omni_admin:admin-test-password@localhost:5432/omni_engine
      OMNI_TEST_RUNTIME_DATABASE_URL: postgresql+psycopg://omni_app:runtime-test-password@localhost:5432/omni_engine
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Create restricted PostgreSQL roles
        run: |
          python - <<'PY'
          import os
          import psycopg

          admin_url = os.environ["OMNI_TEST_ADMIN_DATABASE_URL"].replace(
              "postgresql+psycopg://", "postgresql://", 1
          )
          with psycopg.connect(admin_url, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE omni_app LOGIN PASSWORD 'runtime-test-password' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              conn.execute(
                  "CREATE ROLE omni_migrator LOGIN PASSWORD 'migrator-test-password' "
                  "NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
              conn.execute("GRANT CONNECT ON DATABASE omni_engine TO omni_app")
              conn.execute("GRANT CONNECT ON DATABASE omni_engine TO omni_migrator")
              conn.execute("GRANT USAGE ON SCHEMA public TO omni_app")
              conn.execute("GRANT USAGE, CREATE ON SCHEMA public TO omni_migrator")
          PY
      - name: Apply database migrations
        env:
          OMNI_MIGRATION_DATABASE_URL: postgresql+psycopg://omni_migrator:migrator-test-password@localhost:5432/omni_engine
        run: alembic upgrade head
      - name: Run API and PostgreSQL isolation tests
        run: python -m pytest
      - name: Run Ruff checks
        run: ruff check apps/api
