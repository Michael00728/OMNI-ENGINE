services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni_engine}
      POSTGRES_USER: ${POSTGRES_USER:-omni_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OMNI_APP_DB_PASSWORD: ${OMNI_APP_DB_PASSWORD:?Set OMNI_APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-create-runtime-role.sql:/docker-entrypoint-initdb.d/01-create-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni_admin} -d ${POSTGRES_DB:-omni_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      OMNI_ENVIRONMENT: ${OMNI_ENVIRONMENT:-development}
      OMNI_LOG_LEVEL: ${OMNI_LOG_LEVEL:-INFO}
      OMNI_CORS_ORIGINS: ${OMNI_CORS_ORIGINS:-["http://localhost:3000"]}
      OMNI_DOCS_ENABLED: ${OMNI_DOCS_ENABLED:-true}
      OMNI_DATABASE_URL: postgresql+psycopg://omni_app:${OMNI_APP_DB_PASSWORD:?Set OMNI_APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-omni_engine}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
